<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сучасний Сапер (Minesweeper)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body oncontextmenu="return false;">

<div class="game-wrapper">
    <h1 class="title">MINESWEEPER</h1>

    <div class="header">
        <div class="counter flag-counter">🚩 <span id="flag-count">015</span></div>

        <button id="reset-button" class="reset-button" title="Нова гра">😊</button>

        <div class="counter timer-display">⏱️ <span id="time-count">000</span></div>
    </div>

    <div id="game-board" class="game-board"></div>

    <div id="message-overlay" class="message-overlay hidden">
        <div class="message-box">
            <h2 id="final-message"></h2>
            <button id="play-again-button">Спробувати знову</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
