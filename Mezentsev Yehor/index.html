<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Хедер з елементами управління -->
        <header class="game-header">
            <div class="mines-counter">004</div>
            <button class="restart-button">🙁</button>
            <div class="timer">004</div>
        </header>

        <!-- Ігрове поле -->
        <div class="game-board">
            <!-- Рядок 1 -->
            <div class="cell opened num1">1</div>
            <div class="cell opened num2">2</div>
            <div class="cell opened num1">1</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 2 -->
            <div class="cell opened num2">2</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 3 -->
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 4 -->
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 5 -->
            <div class="cell opened num1">1</div>
            <div class="cell mine">💣</div>
            <div class="cell opened num1">1</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell flagged">🚩</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 6 -->
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 7 -->
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num2">2</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num2">2</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 8 -->
            <div class="cell opened num1">1</div>
            <div class="cell opened num1">1</div>
            <div class="cell opened num2">2</div>
            <div class="cell mine-triggered">💥</div>
            <div class="cell opened num1">1</div>
            <div class="cell flagged-wrong">🚩</div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <!-- Рядок 9 -->
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
