<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="game-container">

    <div class="header">
        <div class="flag-counter counter">💣 <span id="flag-count">010</span></div>

        <button id="reset-button" class="reset-button">
            😊
        </button>

        <div class="timer counter">⏱️ <span id="time-count">000</span></div>
    </div>

    <div id="game-board" class="game-board">
        <div class="cell closed"></div> <div class="cell closed has-flag">🚩</div> <div class="cell closed"></div>
        <div class="cell opened number-1">1</div> <div class="cell opened number-2">2</div>

        <div class="cell opened number-2">2</div>
        <div class="cell opened number-3">3</div>
        <div class="cell opened empty"></div>
        <div class="cell opened number-1">1</div>
        <div class="cell opened empty"></div>

        <div class="cell closed has-flag wrong-flag">🚩</div> <div class="cell opened number-1">1</div>
        <div class="cell opened number-2">2</div>
        <div class="cell opened mine-hit">💥</div> <div class="cell opened mine-revealed">💣</div> <div class="cell closed"></div>
        <div class="cell closed"></div>
        <div class="cell closed"></div>
        <div class="cell closed"></div>
        <div class="cell closed"></div>

        <div class="cell closed"></div>
        <div class="cell closed"></div>
        <div class="cell closed"></div>
        <div class="cell closed"></div>
        <div class="cell closed"></div>

    </div>
</div>

</body>
</html>
